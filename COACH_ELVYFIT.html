<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elvyfit Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Elvyfit Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--card:#141414;--card2:#1d1d1d;--line:#2b2b2b;
  --text:#f2f2f2;--text2:#bdbdbd;--muted:#8c8c8c;
  --red:#e50914;--kg:#7fb2ee;--rep:#f0c419;--up:#2fbf5b;--dn:#ef5b5b;--warn:#f0a920;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 56px}
.brand{color:var(--red);font-weight:700;font-size:12px;letter-spacing:4px}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:44px;line-height:1;margin-top:4px}
.sub{color:var(--text2);font-size:13.5px;margin-top:4px}
.estado{margin-top:14px;font-size:13px;color:var(--text2);background:var(--card);border-radius:10px;padding:10px 12px;border-left:3px solid var(--line)}
.estado.mal{border-left-color:var(--red);color:var(--text)}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
input,select{font-family:inherit}

/* login */
.login{margin-top:16px;background:var(--card);border-radius:12px;padding:16px}
.login h2{font-size:16px;margin-bottom:10px}
.login input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;font-size:16px;margin-bottom:10px}

/* lista */
.lista{margin-top:18px;display:grid;gap:10px}
.cli{display:block;background:var(--card);border:1px solid transparent;border-radius:12px;padding:14px;cursor:pointer;text-align:left;width:100%;color:inherit;font-family:inherit}
.cli:hover,.cli:focus-visible{border-color:var(--line);outline:none}
.cli-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cli b{font-size:18px}
.cli .cuando{font-size:12px;color:var(--muted);white-space:nowrap}
.cli-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;background:var(--card2);border-radius:999px;padding:3px 9px;color:var(--text2)}
.chip.up{color:var(--up)}.chip.dn{color:var(--dn)}.chip.warn{color:var(--warn)}
.acc-cli{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.envio.sec{background:var(--card2);border-color:var(--line);white-space:nowrap}
.vivo{margin-top:10px;font-size:12.5px;color:var(--text2)}.vivo b{color:var(--up)}
.envio{margin-top:0;width:100%;background:rgba(229,9,20,.12);border:1px solid rgba(229,9,20,.45);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.nuevo{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:middle}

/* ficha */
.volver{background:none;border:0;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;padding:6px 0;font-family:inherit;margin-top:6px}
.fh h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:42px;line-height:1;margin-top:6px}
.meta{color:var(--text2);font-size:13px;margin-top:4px}
.meta select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;margin-left:4px}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--text);color:#000;border-color:var(--text)}
.panel{background:var(--card);border-radius:12px;padding:14px;margin-top:12px}
.panel h3{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:10px}
.nota{color:var(--muted);font-size:12.5px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{background:var(--card);border-radius:12px;padding:12px 10px}
.kpi small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.kpi b{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:30px;line-height:1.05;margin-top:4px}
.kpi span{display:block;font-size:12px;color:var(--text2);margin-top:2px}
.kpi b em{font-style:normal;font-family:Inter,sans-serif;font-size:14px;color:var(--text2);font-weight:600}
.concl{list-style:none}
.concl li{position:relative;padding:9px 0 9px 26px;border-top:1px solid #222;font-size:14px}
.concl li:first-child{border-top:0}
.concl li i{position:absolute;left:0;top:9px;font-style:normal;font-weight:700;width:18px;text-align:center}
.wa summary{cursor:pointer;color:var(--kg);font-weight:700;font-size:14px;margin-top:10px}
.watxt{white-space:pre-wrap;font-size:13.5px;line-height:1.5;background:#111;border-radius:8px;padding:10px;margin:8px 0}
.concl li i.up{color:var(--up)}.concl li i.dn{color:var(--dn)}.concl li i.warn{color:var(--warn)}.concl li i.inf{color:var(--kg)}
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.plan div{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text2)}
.plan div b{display:block;color:var(--text);font-size:15px}
.obj{list-style:none}
.obj li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #222;font-size:13.5px}
.obj li:first-child{border-top:0}
.obj li span:last-child{font-weight:700;text-align:right}
.obj .dia{display:block;color:var(--red);font-size:11.5px;letter-spacing:1.5px;font-weight:700;margin-top:10px;border-top:0}

/* gráficas */
.graf{width:100%;height:auto;display:block}
.graf .gl{stroke:#262626;stroke-width:1}
.graf .ax{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif}
.graf .ln{fill:none;stroke:var(--red);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.graf .pt{fill:var(--red);stroke:var(--card);stroke-width:2}
.graf .pt.marc{fill:var(--card);stroke:var(--red);stroke-width:2}
.graf .vl{fill:var(--text2);font-size:11.5px;font-weight:600;font-family:Inter,sans-serif}
.graf .vl.last{fill:var(--text);font-size:13px;font-weight:700}
.br{display:grid;grid-template-columns:86px 1fr 62px;align-items:center;gap:10px;padding:6px 0}
.br+.br{border-top:1px solid #222}
.bl{font-weight:600;font-size:14px}
.bl small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.bt{height:10px;background:#242424;border-radius:5px;overflow:hidden}
.bf{display:block;height:100%;background:var(--red);border-radius:0 5px 5px 0}
.bf.neg{background:#5a5a5a}
.bv{text-align:right;font-weight:700;font-size:14px}
.addpeso{display:flex;gap:8px;align-items:flex-end;margin-top:12px;flex-wrap:wrap}
.addpeso label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.addpeso input{width:84px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px;font-size:16px}
.pesos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pesos .chip button{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:0 0 0 4px}
.ejr{display:grid;grid-template-columns:1fr 84px 62px;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid #222;color:inherit;font-family:inherit;text-align:left;padding:9px 0;cursor:pointer}
.ejr:first-of-type{border-top:0}
.ejr b{display:block;font-size:13.5px;font-weight:600}
.ejr small{font-size:11.5px;color:var(--muted)}
.pc{font-weight:700;font-size:13.5px;text-align:right}
.pc.up{color:var(--up)}.pc.dn{color:var(--dn)}.pc.eq{color:var(--muted)}
.spark{width:84px;height:26px;display:block}
.spark polyline{fill:none;stroke:var(--text2);stroke-width:1.6}
.spark circle{fill:var(--red)}
.ejd{padding:4px 0 12px}
.ejd label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-top:6px}
.ejd input{width:18px;height:18px;accent-color:var(--red)}
.gdia{font-size:11.5px;color:var(--red);letter-spacing:1.5px;font-weight:700;margin:14px 0 2px}

/* series */
.leyenda{margin-top:12px;font-size:12.5px;color:var(--text2);display:flex;gap:14px;flex-wrap:wrap}
.leyenda b.k{color:var(--kg)}.leyenda b.r{color:var(--rep)}
.sdia{margin-top:20px}
.sdia>h3{font-size:13px;color:var(--red);letter-spacing:1.5px}
.ej{background:var(--card);border-radius:12px;padding:12px 12px 10px;margin-top:10px}
.ej-h b{font-size:15px}
.ej-h span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.tscroll{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:3px;min-width:100%}
th{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:2px 4px;white-space:nowrap}
th.last{color:var(--text)}
td.s{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;padding-right:4px}
td.c{background:var(--card2);border-radius:7px;text-align:center;padding:6px 7px;white-space:nowrap;position:relative;min-width:60px}
td.c.last{outline:1px solid #3a3a3a}
td.c .k{color:var(--kg);font-weight:700;font-size:14px}
td.c .x{color:var(--muted);font-size:12px;margin:0 2px}
td.c .r{color:var(--rep);font-weight:700;font-size:14px}
td.c .o{display:block;font-size:10.5px;color:var(--muted)}
td.c i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9px}
td.c i.up{color:var(--up)}td.c i.dn{color:var(--dn)}
td.c.v{background:transparent;border:1px dashed #2f2f2f}

/* fotos */
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.foto{position:relative;border-radius:8px;overflow:hidden;background:var(--card2);aspect-ratio:3/4}
.foto img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.foto span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:11px;padding:14px 6px 4px;color:#fff}
.foto button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer}
.subir{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.subir label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.subir label.btn{color:#fff;flex-direction:row;font-size:14px}
.subir input[type=date]{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-size:15px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.modal img{max-width:100%;max-height:78vh;border-radius:10px}
.modal .acc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.modal .pags{width:100%;max-height:78vh;overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal .pags img{max-height:none;width:100%;max-width:520px}
.pie{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
@media (max-width:380px){ .kpi b{font-size:26px} .br{grid-template-columns:76px 1fr 56px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">ELVYFIT</div>
    <h1>COACH</h1>
    <p class="sub">Tus clientes: lo que apuntan, cómo van y qué toca ahora.</p>
  </header>

  <div id="estado" class="estado">Conectando…</div>
  <p id="vivo" class="vivo hidden"><b>●</b> En directo: cuando un cliente apunta en su planning, aparece aquí solo.</p>

  <form id="login" class="login hidden" autocomplete="on">
    <h2>Entra con tu cuenta de Elvyfit</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn full" type="submit">Entrar</button>
  </form>

  <section id="vistaLista"><div id="lista" class="lista"></div></section>

      <button class="tab" data-tab="progreso" type="button">Progreso</button>
      <button class="tab" data-tab="series" type="button">Series</button>
      <button class="tab" data-tab="fotos" type="button">Fotos</button>
    </nav>
    <div id="tabBody"></div>
  </section>

  <p class="pie">Este móvil está marcado como el de Marc: aquí los plannings de clientes no envían nada.<span id="salir" class="hidden"> · <a href="#" id="salirBtn" style="color:var(--muted)">Cerrar sesión</a></span></p>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  /* ================= unir lo del plan con lo de la nube ================= */
  function nubeDe(slug){ return DOCS.filter(function(d){ return d.slug===slug; }).sort(function(a,b){ return (b.t||0)-(a.t||0); }); }
  function mezcla(base, nube){
    var out={dias:[],peso:{}}, idx={};
    function suma(doc, manda){
      if(!doc) return;
      for(var w in (doc.peso||{})) if(manda||out.peso[w]==null) out.peso[w]=doc.peso[w];
      (doc.dias||[]).forEach(function(d){
        var kd=normDia(d.dia), D=idx[kd]; if(!D){ D=idx[kd]={dia:d.dia,ejercicios:[],porNombre:{}}; out.dias.push(D); }
        (d.ejercicios||[]).forEach(function(e){
          var X=D.porNombre[e.nombre]; if(!X){ X=D.porNombre[e.nombre]={nombre:e.nombre,detalle:e.detalle,series:[]}; D.ejercicios.push(X); }

  function docCliente(slug, disp){

  }

  /* ================= análisis ================= */
  function semanasDe(doc){ var w={}; doc.dias.forEach(function(d){ d.ejercicios.forEach(function(e){ e.series.forEach(function(s){ for(var k in s.sem) w[k]=1; }); }); }); return Object.keys(w).map(Number).sort(function(a,b){return a-b;}); }
  function fuerzaSemanas(e){

  function analiza(doc){
    var slug=doc.slug, CO=COACH[slug]||{}, excl=CO.excluir||[], incl=CO.incluir||[], ejs=[], G={}, Gbw={}, glob=[];

      var p=fuerzaSemanas(e), g=grupo(e.nombre), key=d.dia+'|'+e.nombre, x={dia:d.dia,e:e,nombre:e.nombre,grupo:g,pts:p,pct:null,key:key,fuera:excl.indexOf(key)>=0};

  /* ================= conclusiones ================= */
  function conclusiones(doc,A){

      var t='Peso: '+coma(a.kg)+' → '+coma(b.kg)+' kg ('+kgTxt(dif)+' en '+sem+(sem===1?' semana':' semanas')+', '+kgTxt(rk).replace(' kg',' kg/sem')+', '+coma(rp,1)+' % de su peso por semana).';

      else if(meta==='vol'){ if(dif<-0.2){ t+=' Baja en volumen: le faltan kcal.'; ic='dn'; } else if(rp<0.1){ t+=' Estancado en volumen: toca subir kcal.'; ic='warn'; } else if(rp<=0.5){ t+=' Buen ritmo de volumen.'; ic='up'; } else { t+=' Sube rápido: puede estar ganando grasa de más.'; ic='warn'; } }
      out.push([ic,t]);
      if(C&&C.peso&&Math.abs(C.peso-a.kg)>0.3&&Math.abs(b.kg-C.peso)>=0.3) out.push(['inf','Respecto al peso del plan ('+coma(C.peso)+' kg): '+kgTxt(b.kg-C.peso)+'.']);
    } else if(A.peso.length===1) out.push(['warn','Solo hay un peso apuntado (S'+A.peso[0].w+'). Con el de la semana que viene ya se ve la tendencia.']);
    else out.push(['warn','Sin peso corporal apuntado. Pídeselo el domingo en ayunas o apúntalo tú en Progreso.']);
    /* fuerza */
    if(A.global!=null){
      var t2='Fuerza global '+pctTxt(A.global)+' desde S'+A.sems[0]+'.';
      var gg=A.grupos.filter(function(g){ return g.g!=='Abdomen'&&!g.bw; });
      if(gg.length>1) t2+=' Lo que más sube: '+gg[0].g+' '+pctTxt(gg[0].v)+'. Lo que menos: '+gg[gg.length-1].g+' '+pctTxt(gg[gg.length-1].v)+'.';
      if(meta==='def'&&A.global>0) t2+=' Gana fuerza en déficit: muy buena señal.';

    }
    var baja=A.ejs.filter(function(x){ return x.ult!=null&&x.ult<=-2&&x.pts.length>=2&&x.pts[x.pts.length-1].w===A.L; });
    if(baja.length) out.push(['dn','Bajan esta semana: '+lista(baja.map(function(x){ return x.nombre+' ('+pctTxt(x.ult)+')'; }))+'.']);
    var raros=A.ejs.filter(function(x){ return x.raro; });
    if(raros.length) out.push(['warn','Caída muy grande en '+lista(raros.map(function(x){ return x.nombre+' ('+pctTxt(x.pct)+')'; }))+': ¿otra máquina o polea? '+(raros.some(function(x){ return x.fuera; })?'No lo cuento en el %; si fue real, márcalo en Progreso.':'Lo estás contando en el %.')]);
    var plano=A.ejs.filter(function(x){ var p=x.pts; if(p.length<3) return false; var a=p[p.length-3].v,b=p[p.length-2].v,c=p[p.length-1].v; return b<=a*1.005&&c<=b*1.005; });

        var top=0; x.e.series.forEach(function(s2){ var c2=s2.sem[w]; var k2=c2&&num(c2.kg); if(k2&&k2>top) top=k2; });

  /* ================= gráficas (SVG) ================= */

  function comprime(file){

        URL.revokeObjectURL(url); ok(d);

      img.src=url;

  }

  function graficaArea(x,pts,bx,by,bw,bh,col,rgb,cero,I){

    var n=pts.length, X=function(i){ return n===1?bx+bw/2:bx+i*bw/(n-1); }, Y=function(v){ return by+(hi-v)/(hi-lo)*bh; };
    var g=x.createLinearGradient(0,by,0,by+bh); g.addColorStop(0,'rgba('+rgb+',0.55)'); g.addColorStop(1,'rgba('+rgb+',0)');
    x.beginPath(); x.moveTo(X(0),by+bh); pts.forEach(function(p,i){ x.lineTo(X(i),Y(p.v)); }); x.lineTo(X(n-1),by+bh); x.closePath(); x.fillStyle=g; x.fill();
    if(cero){ x.setLineDash([10,12]); x.strokeStyle='#3a3a3a'; x.lineWidth=2; x.beginPath(); x.moveTo(bx,Y(0)); x.lineTo(bx+bw,Y(0)); x.stroke(); x.setLineDash([]); }
    x.strokeStyle=col; x.lineWidth=8; x.lineJoin='round'; x.lineCap='round'; x.beginPath();

    var slug=doc.slug;
    var ini=FOTOS_INI[slug]?Promise.resolve(FOTOS_INI[slug]):(doc.archivo?fetch(encodeURI(doc.archivo)).then(function(r){ return r.text(); }).then(function(t){
      var re=/src="(data:image\/(?:jpeg|jpg|png|webp);base64,[A-Za-z0-9+\/=]+)"/g, m, out=[];
      while((m=re.exec(t))) if(m[1].length>30000&&out.indexOf(m[1])<0) out.push(m[1]);
      FOTOS_INI[slug]=out; return out;
    }).catch(function(){ return []; }):Promise.resolve([]));
    var gal=db.collection('coach').doc(slug).collection('fotos').orderBy('t','asc').limit(40).get().then(function(snap){
      var o=[]; snap.forEach(function(d){ var f=d.data(); if(f.img) o.push({src:f.img,fecha:f.fecha}); }); return o;
    }).catch(function(){ return []; });
    return Promise.all([ini,gal]).then(function(v){ return {ini:v[0],gal:v[1]}; });
  }
  function imagen(src){ return new Promise(function(ok){ if(!src) return ok(null); var im=new Image(); im.onload=function(){ ok(im); }; im.onerror=function(){ ok(null); }; im.src=src; }); }
  function cargaFotosImg(r){
    var gal=r.gal||[];
    return Promise.all([imagen(r.ini&&r.ini[0]), Promise.all(gal.map(function(g){ return imagen(g.src); }))]).then(function(v){
      var gi=v[1].map(function(im,i){ return im?{img:im,fecha:gal[i].fecha}:null; }).filter(Boolean);
      var inicio=v[0]?{img:v[0],fecha:'',txt:'AL EMPEZAR'}:(gi.length>=2?{img:gi[0].img,fecha:gi[0].fecha,txt:'PRIMERA FOTO'}:null);
      var hoyF=gi.length?{img:gi[gi.length-1].img,fecha:gi[gi.length-1].fecha,txt:'HOY'}:null;
      return {inicio:inicio,hoy:hoyF,galeria:gi};
    });
  }

  /* ----- PDF (un único archivo, páginas JPEG) ----- */
  function bytesJpeg(u){ var b=atob(u.split(',')[1]), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function creaPDF(jpegs,W,H){
    var enc=new TextEncoder(), partesPDF=[], pos=0, offs=[];
    function str(s){ var b=enc.encode(s); partesPDF.push(b); pos+=b.length; }
    function bin(b){ partesPDF.push(b); pos+=b.length; }
    var n=jpegs.length, pw=W*0.75, ph=H*0.75, kids=[];
    for(var i=0;i<n;i++) kids.push((3+3*i)+' 0 R');
    str('%PDF-1.4\n');
    offs[1]=pos; str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2]=pos; str('2 0 obj\n<< /Type /Pages /Count '+n+' /Kids ['+kids.join(' ')+'] >>\nendobj\n');
    for(var k=0;k<n;k++){
      var pg=3+3*k, im=4+3*k, ct=5+3*k, jb=jpegs[k];
      offs[pg]=pos; str(pg+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im'+k+' '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
      offs[im]=pos; str(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jb.length+' >>\nstream\n'); bin(jb); str('\nendstream\nendobj\n');
      var cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im'+k+' Do Q';
      offs[ct]=pos; str(ct+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    }
    var maxObj=5+3*(n-1), xref=pos, tabla='xref\n0 '+(maxObj+1)+'\n0000000000 65535 f \n';
    for(var q=1;q<=maxObj;q++) tabla+=('0000000000'+offs[q]).slice(-10)+' 00000 n \n';
    str(tabla); str('trailer\n<< /Size '+(maxObj+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
    var out=new Uint8Array(pos), p=0; partesPDF.forEach(function(b){ out.set(b,p); p+=b.length; });
    return out;
  }
  function fuentesListas(){
    if(!(document.fonts&&document.fonts.load)) return Promise.resolve();
    return Promise.all([document.fonts.load('136px "Bebas Neue"'),document.fonts.load('800 26px Inter'),document.fonts.load('600 32px Inter')]).then(function(){},function(){});
  }
  function generaDocumento(doc,A){
    return fuentesListas().then(function(){ return fotosDe(doc); }).then(cargaFotosImg).then(function(F){
      var cs=construyeDoc(doc,A,F,conclusiones(doc,A),objetivosSemana(A));
      var jp=cs.map(function(c){ return bytesJpeg(c.toDataURL('image/jpeg',0.9)); });
      return {pdf:creaPDF(jp,1080,1350), previews:cs.map(function(c){ return c.toDataURL('image/jpeg',0.8); }), n:cs.length};
    });
  }
  function abreInforme(doc,A){
    modal('<div class="acc"><p class="nota">Preparando el documento…</p></div>');
    generaDocumento(doc,A).then(function(r){
      var nombre='resumen-'+doc.slug+'-'+hoy()+'.pdf', blob=new Blob([r.pdf],{type:'application/pdf'}), url=URL.createObjectURL(blob), file=null;
      try{ file=new File([blob],nombre,{type:'application/pdf'}); }catch(e){}
      modal('<div class="pags">'+r.previews.map(function(u,i){ return '<img src="'+u+'" alt="Página '+(i+1)+' de '+r.n+'">'; }).join('')+'</div><div class="acc"><button class="btn" type="button" id="mEnviar">📤 Enviar PDF por WhatsApp</button><a class="btn sec" id="mBajar" download="'+nombre+'" href="'+url+'">Descargar PDF</a><button class="btn sec" type="button" data-cerrar>Cerrar</button></div>');
      $('mEnviar').onclick=function(){
        var txt=doc.nombre+', aquí tienes tu progreso hasta la semana '+(A.L||'');
        if(file&&navigator.canShare&&navigator.canShare({files:[file]})) navigator.share({files:[file],text:txt}).catch(function(){});
        else { $('mBajar').click(); toast('PDF descargado: mándalo por WhatsApp'); }
      };
    }).catch(function(){ modal('<div class="acc"><p class="nota">No se ha podido generar el documento. Revisa tu conexión y vuelve a intentarlo.</p><button class="btn sec" type="button" data-cerrar>Cerrar</button></div>'); });
  }
  function bajaInforme(doc,A){
    generaDocumento(doc,A).then(function(r){
      var u=URL.createObjectURL(new Blob([r.pdf],{type:'application/pdf'})), a=document.createElement('a');
      a.href=u; a.download='resumen-'+doc.slug+'-'+hoy()+'.pdf'; document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },4000); toast('PDF descargado');
    }).catch(function(){ toast('No se ha podido generar el documento'); });
  }

  /* ================= conexión ================= */
  $('lista').addEventListener('click',function(e){
    var baj=e.target.closest('[data-bajar]'); if(baj){ var d0=docCliente(baj.getAttribute('data-bajar')); bajaInforme(d0,analiza(d0)); return; }
    var env=e.target.closest('[data-envio]'); if(env){ var d=docCliente(env.getAttribute('data-envio')); abreInforme(d,analiza(d)); return; }
    var b=e.target.closest('.cli'); if(b) abre(b.getAttribute('data-slug'));
  });
  $('lista').addEventListener('keydown',function(e){ if(e.key!=='Enter'&&e.key!==' ') return; var b=e.target.closest('.cli'); if(b&&e.target===b){ e.preventDefault(); abre(b.getAttribute('data-slug')); } });
  $('volver').onclick=cierra;
  function repinta(){ if(cliente) pintaFicha(); else pintaLista(); }
  function escucha(){
    quitar.forEach(function(f){ try{ f(); }catch(e){} }); quitar=[];
    estado('Conectando…');
    quitar.push(db.collection('seguimiento').onSnapshot(function(snap){
      DOCS=[]; snap.forEach(function(d){ DOCS.push(d.data()); });
      var ult={}; DOCS.forEach(function(d){ if(d.slug&&(d.t||0)>(ult[d.slug]||0)) ult[d.slug]=d.t||0; });
      if(VISTO){ for(var sg in ult) if(ult[sg]>(VISTO[sg]||0)){ var R=reg(sg); toast('📥 '+((R&&R.nombre)||sg)+' acaba de apuntar'); } }
      VISTO=ult;
      estado(''); $('login').classList.add('hidden'); $('vivo').classList.remove('hidden');
      if(!cliente){ var h=decodeURIComponent(location.hash.slice(1)); if(h&&(reg(h)||DOCS.some(function(d){ return d.slug===h; }))){ abre(h); return; } }
      repinta();
    },function(err){
      if(err&&err.code==='permission-denied'){
        if(auth.currentUser) estado('⚠️ Tu cuenta no tiene permiso para leer el seguimiento. Revisa las reglas de Firestore.','mal');
        else { estado('Entra para ver el seguimiento de tus clientes.'); $('login').classList.remove('hidden'); }
      } else estado('⚠️ No se ha podido conectar ('+esc(err&&err.code||'error')+'). Revisa internet y recarga.','mal');
    }));
    if(auth.currentUser) quitar.push(db.collection('coach').onSnapshot(function(snap){
      COACH={}; snap.forEach(function(d){ COACH[d.id]=d.data(); }); coachOK=true; repinta();
    },function(){ coachOK=false; }));
  }
  $('login').addEventListener('submit',function(e){
    e.preventDefault(); estado('Entrando…');
    auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value).catch(function(err){
      estado('⚠️ No se ha podido entrar: '+esc(err&&err.code==='auth/invalid-credential'?'email o contraseña incorrectos':(err&&err.code||'error')),'mal');
    });
  });
  $('salirBtn').onclick=function(e){ e.preventDefault(); auth.signOut(); };
  auth.onAuthStateChanged(function(u){ $('salir').classList.toggle('hidden',!u); escucha(); });
  Promise.all(REG.map(cargaPlan)).then(repinta);
  setInterval(function(){ if(!cliente) pintaLista(); },60000);
})();
</script>
